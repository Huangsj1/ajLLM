experiment: debug
dataset: debug
tokenizer: debug_bpe_300
model: transformer_tiny

data_splits:
  train: train
  validation: validation

training:
  batch_size: 2
  max_steps: 5
  gradient_clip: 1.0

optimizer:
  type: adamw
  max_lr: 6.0e-4
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1

scheduler:
  type: warmup_cosine
  warmup_steps: 1

logging:
  log_interval: 1
  eval_interval: 2
  eval_batches: 2
  checkpoint_interval: 2

runtime:
  device: auto
  seed: 42

