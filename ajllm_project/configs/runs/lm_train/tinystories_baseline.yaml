experiment: tinystories_baseline
dataset: tinystories
tokenizer: tinystories_bpe_10k
model: transformer_baseline

data_splits:
  train: train
  validation: validation

training:
  batch_size: 64
  total_tokens: 327680000
  gradient_clip: 1.0

optimizer:
  type: adamw
  max_lr: 1.0e-3
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1

scheduler:
  type: warmup_cosine
  warmup_steps: 500

logging:
  log_interval: 50
  eval_interval: 1000
  eval_batches: 100
  checkpoint_interval: 10000

runtime:
  device: auto
  seed: 42

