# Experimental sparse variant: same compute path, four FFN experts per layer.

name: moe
model_type: moe

# Model architecture (same base as dense)
d_model: 768
num_layers: 8
num_heads: 12
num_kv_heads: 4  # GQA: 4 KV heads for 12 query heads (3:1)
context_length: 512
max_position_embeddings: 32768

# Feed-forward network per expert
d_ff: 2432

# MoE specific
num_experts: 4
num_experts_per_token: 1  # Top-1 routing
router_aux_loss_coef: 5.0e-4  # Load balancing loss coefficient

# Position encoding
rope_theta: 1000000.0

# Normalization
qk_norm: true
rms_norm_eps: 1.0e-6

# Regularization
dropout: 0.0

# Embeddings
tie_embeddings: true

# Acceleration
use_flash_attention: true
