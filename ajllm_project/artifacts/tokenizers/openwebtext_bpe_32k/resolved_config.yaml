dataset:
  name: openwebtext
  description: OpenWebText training and validation corpora
  splits:
    train: data/raw/openwebtext/train.txt
    validation: data/raw/openwebtext/validation.txt
tokenizer:
  name: openwebtext_bpe_32k
  vocab_size: 32000
  special_tokens:
  - <|endoftext|>
  pretokenization:
    parallel: true
    num_processes: null
    chunk_size_bytes: 8388608
split: train
_meta:
  source: /root/autodl-tmp/ajLLM/ajllm_project/configs/runs/tokenizer_train/openwebtext_bpe_32k.yaml
  project_root: /root/autodl-tmp/ajLLM/ajllm_project
