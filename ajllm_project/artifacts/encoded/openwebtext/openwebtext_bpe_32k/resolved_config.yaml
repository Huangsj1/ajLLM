dataset:
  name: openwebtext
  description: OpenWebText training and validation corpora
  splits:
    train: data/raw/openwebtext/train.txt
    validation: data/raw/openwebtext/validation.txt
tokenizer:
  name: openwebtext_bpe_32k
  vocab_size: 32000
  special_tokens:
  - <|endoftext|>
  pretokenization:
    parallel: true
    num_processes: null
    chunk_size_bytes: 8388608
splits:
- train
- validation
encoding:
  parallel: true
  num_processes: null
  chunk_size: 16777216
  buffer_tokens: 65536
  max_pretoken_bytes: 8192
  long_pretoken_strategy: byte_fallback
