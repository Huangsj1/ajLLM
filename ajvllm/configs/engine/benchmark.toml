# Long-context benchmark for a 12 GiB GPU. Scheduling limits remain fixed.
[engine]
max_model_len = 16384
max_num_batched_tokens = 8192
max_num_seqs = 32
enable_chunked_prefill = true
# Prefill shares the remaining token budget dynamically among actual requests.

[memory]
backend = "paged"
block_size = 16
# Omit num_blocks to size the pool from profiled available GPU memory.
enable_prefix_cache = true
cache_namespace = "local"

[compute]
backend = "auto" # Triton paged kernels for FP16/BF16 on SM80+; eager reference otherwise.

[graphs]
enabled = true
batch_sizes = [1, 2, 4, 8]
max_graphs = 8
memory_limit_mb = 128

[quantization]
# mode = "none" # "w8a16" quantizes decoder projections; activations/KV stay FP16/BF16.

# HTTP comparison workload; CLI flags override these values.
[compare]
concurrency = [1, 2, 4, 8, 16, 32]
prompt_lengths = [128, 256, 512, 1024]
requests = 64
max_tokens = 64
repeats = 3
gpu_memory_utilization = 0.7
# Omit concurrency to derive powers of two plus engine.max_num_seqs.
# Model, dataset, output, GPU, port and timeouts can also be set here.
