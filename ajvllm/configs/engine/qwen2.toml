# Conservative eager baseline for a 12 GB GPU; no cache block allocator yet.
[engine]
max_num_seqs = 4                    # Scheduler max total batch sequence size
max_num_batched_tokens = 128        # Scheduler max total budget
max_model_len = 2048                # model's max seq_len
enable_chunked_prefill = true
max_prefill_chunk_size = 64         # max chunk prefill size for a request
max_prefill_tokens_per_step = 96   # aggregate prefill cap within the shared scheduler budget
