# Opt-in 1.5B target + 0.5B draft preset; pass the target checkpoint with --model.
# K=4 is a starting point, not a guarantee of speedup; see the benchmark guide.
[engine]
max_model_len = 16384
max_num_batched_tokens = 8192
max_num_seqs = 32
enable_chunked_prefill = true
# Prefill shares the remaining token budget dynamically among actual requests.

[memory]
backend = "paged"
block_size = 16
# Omit num_blocks to size the pool from profiled available GPU memory.
enable_prefix_cache = true
cache_namespace = "local"

[compute]
backend = "auto" # Triton paged kernels for FP16/BF16 on SM80+; eager reference otherwise.

[graphs]
enabled = true
batch_sizes = [1, 2, 4, 8]
max_graphs = 8
memory_limit_mb = 128

[quantization]
# mode = "none" # "w8a16" quantizes decoder projections; activations/KV stay FP16/BF16.


[speculative]
enabled = true
draft_model = "model/Qwen2.5-0.5B-Instruct"
num_draft_tokens = 4
