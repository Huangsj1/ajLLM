[engine]
max_num_seqs = 16
max_num_batched_tokens = 5000
max_model_len = 1088
enable_chunked_prefill = true
max_prefill_chunk_size = 5000
max_prefill_tokens_per_step = 5000
[memory]
backend = "paged"
block_size = 16
num_blocks = 1088
enable_prefix_cache = false
[compute]
backend = "triton"
[graphs]
enabled = true
batch_sizes = [1, 2, 4, 8, 16]
max_graphs = 32
memory_limit_mb = 512
[quantization]
mode = "none"
