[engine]
max_num_seqs = 4
max_num_batched_tokens = 512
max_model_len = 1088
enable_chunked_prefill = true
max_prefill_chunk_size = 512
max_prefill_tokens_per_step = 512
[memory]
backend = "paged"
block_size = 16
num_blocks = 272
enable_prefix_cache = false
[compute]
backend = "triton"
[graphs]
enabled = false
batch_sizes = [1, 2, 4]
max_graphs = 8
memory_limit_mb = 128
[quantization]
mode = "none"
