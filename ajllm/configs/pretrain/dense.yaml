# Dense baseline. Keep this configuration unchanged for a fair MoE comparison.
model_config: configs/model/dense.yaml
data_path: data/pretrain_t2t.jsonl
validation_data_path: null  # Optional JSONL with the same {"text": ...} schema.
tokenizer:
  path: assets/tokenizers/minimind

epochs: 1  # One epoch visits every JSONL record once.
max_steps: null  # Set, for example, 100 for a short smoke run; null completes every epoch.
batch_size: 32
gradient_accumulation_steps: 1  # This GPU's dense-model memory limit.
eval_batch_size: 32

num_workers: 0

max_seq_len: 512

learning_rate: 5.0e-4
min_lr: 5.0e-5
warmup_steps: 2000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
mixed_precision: bf16  # bf16, fp16, or null

log_interval: 100
eval_interval: 1000       # 0 disables periodic validation.
eval_batches: null       # null evaluates the complete validation set.
save_interval: 50000
output_dir: output/pretrain/dense
resume_from: null

device: auto
seed: 42
use_fsdp: false
fsdp_config:
  sharding_strategy: FULL_SHARD
  cpu_offload: false
  use_activation_checkpointing: true
